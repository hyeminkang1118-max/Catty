<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><radialGradient id="age" cx="50%" cy="50%" r="70%"><stop offset=".6" stop-color="#6a5530" stop-opacity="0"/><stop offset="1" stop-color="#4a3410" stop-opacity=".5"/></radialGradient></defs>
<rect width="1600" height="900" fill="#141210"/>
<rect x="180" y="60" width="1240" height="780" fill="#d9ccaa"/>
<rect x="180" y="60" width="1240" height="780" fill="url(#age)"/>
<text x="800" y="140" fill="#5a4a2e" font-family="'Nanum Myeongjo', serif" font-size="40" text-anchor="middle" letter-spacing="6">창 세 기   6 장</text>
<line x1="250" y1="170" x2="1350" y2="170" stroke="#5a4a2e" stroke-width="2"/>
<text x="250" y="230" fill="#3a2f1e" font-family="'Nanum Myeongjo', serif" font-size="34">13 하나님이 노아에게 이르시되 모든 혈육 있는 자의</text><text x="250" y="286" fill="#3a2f1e" font-family="'Nanum Myeongjo', serif" font-size="34">    포악함이 땅에 가득하므로 그 끝날이 내 앞에 이르렀으니</text><text x="250" y="342" fill="#3a2f1e" font-family="'Nanum Myeongjo', serif" font-size="34">14 너는 고페르 나무로 너를 위하여 방주를 만들되</text><text x="250" y="398" fill="#3a2f1e" font-family="'Nanum Myeongjo', serif" font-size="34">    그 안에 칸들을 막고 역청을 그 안팎에 칠하라</text><rect x="236" y="414" width="1120" height="112" fill="#e8f04a" opacity=".55" transform="rotate(-.5 800 454)"/><text x="250" y="454" fill="#1e170c" font-family="'Nanum Myeongjo', serif" font-size="34" font-weight="bold">15 그 방주의 제도는 이러하니 길이가 삼백 규빗,</text><text x="250" y="510" fill="#1e170c" font-family="'Nanum Myeongjo', serif" font-size="34" font-weight="bold">    너비가 오십 규빗, 높이가 삼십 규빗이며</text><text x="250" y="566" fill="#3a2f1e" font-family="'Nanum Myeongjo', serif" font-size="34">16 거기에 창을 내되 위에서부터 한 규빗에 내고</text><text x="250" y="622" fill="#3a2f1e" font-family="'Nanum Myeongjo', serif" font-size="34">    그 문은 옆으로 내고 상 중 하 삼층으로 할지니라</text>
<text x="1350" y="810" fill="#5a4a2e" font-family="'Nanum Myeongjo', serif" font-size="26" text-anchor="end">— 9 —</text>
<text x="30" y="880" fill="#fff" opacity=".22" font-family="'Nanum Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22">임시 이미지 — assets/images/bible-page.svg</text>
</svg>
