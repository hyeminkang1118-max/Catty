<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catty 방탈출</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 시작 화면 -->
  <section id="start-screen" class="screen active">
    <h1 id="game-title"></h1>
    <p id="game-subtitle"></p>
    <button id="start-btn" class="btn primary">시작하기</button>
    <button id="continue-btn" class="btn" hidden>이어하기</button>
    <p class="note">🔊 소리를 켜고 플레이하세요</p>
  </section>

  <!-- 게임 화면 -->
  <section id="game-screen" class="screen">
    <header class="topbar">
      <span id="chapter-label"></span>
      <div class="progress"><div id="progress-bar"></div></div>
      <button id="mute-btn" class="icon-btn" title="음악 켜기/끄기">🔊</button>
    </header>

    <div id="media-box" class="media-box"></div>

    <div class="story-box">
      <p id="story-text"></p>
      <button id="next-line-btn" class="btn">다음 ▶</button>
    </div>

    <!-- 퀴즈 -->
    <div id="quiz-box" class="quiz-box" hidden>
      <h2>🔒 잠긴 문</h2>
      <p id="quiz-question"></p>
      <div id="quiz-choices" class="choices"></div>
      <form id="quiz-form" autocomplete="off">
        <input id="quiz-input" type="text" placeholder="정답 입력" />
        <button class="btn primary" type="submit">확인</button>
      </form>
      <p id="quiz-feedback" aria-live="polite"></p>
      <button id="hint-btn" class="btn small" type="button">💡 힌트 보기</button>
      <p id="quiz-hint" hidden></p>
    </div>

    <button id="next-scene-btn" class="btn primary next-scene" disabled>🔒 다음 방으로</button>
  </section>

  <!-- 엔딩 화면 -->
  <section id="end-screen" class="screen">
    <h1>🎉 탈출 성공!</h1>
    <p id="end-text"></p>
    <p id="end-stats"></p>
    <button id="restart-btn" class="btn primary">처음부터 다시</button>
  </section>

  <audio id="bgm" loop></audio>
  <audio id="sfx"></audio>

  <script src="story.js"></script>
  <script src="game.js"></script>
</body>
</html>
