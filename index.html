<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PERFECT HUMAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 시작 화면 -->
    <section id="start-screen" class="screen active">
      <p class="boot" id="boot-log"></p>
      <h1 class="glitch" id="game-title"></h1>
      <p id="game-subtitle" class="subtitle"></p>
      <form id="name-form" class="name-form" autocomplete="off">
        <label for="name-input">피험자 이름을 입력하십시오</label>
        <input id="name-input" maxlength="10" placeholder="이름" />
        <button class="btn primary" type="submit">▶ 해동 시작</button>
      </form>
      <button id="continue-btn" class="btn" hidden>이어하기</button>
      <p class="note">🎧 이어폰을 착용하고 소리를 켜 주세요</p>
    </section>

    <!-- 게임 화면 -->
    <section id="game-screen" class="screen">
      <header class="topbar">
        <span id="chapter-label"></span>
        <div class="progress"><div id="progress-bar"></div></div>
        <button id="mute-btn" class="icon-btn" title="소리 켜기/끄기">🔊</button>
      </header>

      <div class="layout">
        <!-- 상태창 -->
        <aside class="status" id="status">
          <button class="status-head" id="status-toggle" type="button">
            <span>[ 상태창 ]</span><span class="caret">▾</span>
          </button>
          <div class="profile">
            <div class="avatar" aria-hidden="true"></div>
            <div>
              <div class="pname" id="status-name"></div>
              <div class="pid" id="status-id"></div>
            </div>
          </div>
          <div class="countdown" id="countdown" hidden>
            <span>방주호 출발까지</span>
            <b id="countdown-time">03:00:00</b>
          </div>
          <dl class="info" id="status-info"></dl>
          <div class="inv-title" id="inv-title" hidden>소지품</div>
          <ul class="inventory" id="inventory"></ul>
          <div class="log-title">SYSTEM LOG</div>
          <ul class="log" id="status-log"></ul>
        </aside>

        <main class="main">
          <div id="media-box" class="media-box"></div>

          <div class="dialogue" id="dialogue" tabindex="0">
            <div class="speaker" id="speaker" hidden></div>
            <p id="story-text"></p>
            <span class="advance" id="advance">▼</span>
          </div>

          <!-- 퀴즈 -->
          <div id="quiz-box" class="quiz-box" hidden>
            <div class="quiz-title"><span class="lock">■</span> <span id="quiz-title"></span></div>
            <div id="quiz-images" class="quiz-images"></div>
            <p id="quiz-question"></p>
            <div id="quiz-tool" class="caesar" hidden>
              <div class="caesar-head">
                <span>알파벳 원판</span>
                <button type="button" class="btn small" id="caesar-minus" aria-label="한 칸 왼쪽으로">◀</button>
                <b id="caesar-shift">0</b>
                <button type="button" class="btn small" id="caesar-plus" aria-label="한 칸 오른쪽으로">▶</button>
              </div>
              <div class="caesar-rows"><div id="caesar-top" class="caesar-row"></div><div id="caesar-bottom" class="caesar-row shifted"></div></div>
            </div>
            <div id="quiz-order" class="order" hidden>
              <div id="order-slots" class="order-slots"></div>
              <div id="order-pieces" class="order-pieces"></div>
              <button type="button" class="btn primary" id="order-check">확인</button>
            </div>
            <form id="quiz-fields" class="fields" autocomplete="off" hidden>
              <div id="fields-list" class="fields-list"></div>
              <button class="btn primary" type="submit">확인</button>
            </form>
            <div id="quiz-choices" class="choices"></div>
            <form id="quiz-form" autocomplete="off">
              <input id="quiz-input" type="text" placeholder="> 답 입력" />
              <button class="btn primary" type="submit">확인</button>
            </form>
            <p id="quiz-feedback" aria-live="polite"></p>
            <button id="hint-btn" class="btn small" type="button"></button>
            <ol id="quiz-hints" class="hints"></ol>
          </div>

          <button id="next-scene-btn" class="btn primary next-scene" hidden disabled></button>
        </main>
      </div>
    </section>

    <!-- 엔딩 화면 -->
    <section id="end-screen" class="screen">
      <p class="end-code" id="end-code"></p>
      <h1 class="glitch" id="end-title"></h1>
      <p id="end-text" class="subtitle"></p>
      <p id="end-stats" class="note"></p>
      <button id="restart-btn" class="btn primary">처음부터 다시</button>
    </section>
  </div>

  <!-- 소지품 보기 -->
  <div id="viewer" class="overlay" hidden>
    <div class="viewer-box" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
      <h3 id="viewer-title"></h3>
      <div id="viewer-images" class="viewer-images"></div>
      <p id="viewer-text"></p>
      <button id="viewer-close" class="btn primary" type="button">닫기</button>
    </div>
  </div>

  <div class="fx-scanlines" aria-hidden="true"></div>
  <div class="fx-vignette" aria-hidden="true"></div>
  <div class="fx-flash" id="fx-flash" aria-hidden="true"></div>

  <audio id="bgm" loop></audio>

  <script src="story.js"></script>
  <script src="game.js"></script>
</body>
</html>
